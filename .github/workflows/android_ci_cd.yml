name: Android CI CD Workflow

on:
  push:
    branches:
      - 'feature/**'
      - 'bug/**'
      - 'refactor/**'

  pull_request:
    branches:
      - 'development'

jobs:
  # ----------------------------
  # ジョブ１：CI
  # ----------------------------
  ci_check:
    runs-on: ubuntu-latest

    steps:
      # --- A.環境設定フェーズ ---

      # GitのリポジトリコードをubuntuのVM上にクローンする
      - name: Checkout Code
        uses: actions/checkout@v4

      # JDKのセットアップ
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # --- B.テストフェーズ ---

      # Android Lint、Unitテスト、ビルドの実行
      - name: Run Checks and Build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug
        continue-on-error: true

      # --- C.結果ファイルアップロードフェーズ

      # Unitテスト結果ファイルのアップロード
      - name: Upload Unit Test Reports (If Failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

      # Lint結果ファイルのアップロード
      - name: Upload Lint Reports (If Failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*

  # ----------------------------
  # ジョブ２：CD
  # ----------------------------
